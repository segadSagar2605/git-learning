<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleText Document Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-bar">
        <div class="brand">SimpleText</div>
        <nav class="nav-links">
            </nav>
    </header>

    <div class="dashboard-container">
        
        <section class="sidebar">
            <h3>Add New Document</h3>
            <label for="doc_title">Title:</label>
            <input type="text" id="doc_title" placeholder="Enter title...">

            <label for="doc_type">Type:</label>
            <select id="doc_type">
                <option value="Spreadsheet">Spreadsheet</option>
                <option value="PDF">PDF</option>
                <option value="Word">Word Document</option>
            </select>

            <label for="doc_content_summary">Content Summary:</label>
            <textarea id="doc_content_summary" placeholder="Twitter-style summary..."></textarea>

            <button type="button" onclick="saveDocument()">Save to SimpleText</button>
            <p id="statusMsg"></p>
        </section>

        <main class="main-content">
            <h3>Document Dashboard</h3>
            <table id="docTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Type</th>
                        <th>Created By</th>
                        <th>Summary</th>
                    </tr>
                </thead>
                <tbody id="docTableBody">
                    </tbody>
            </table>
        </main>
    </div>

    <script>
        async function saveDocument() {
            const title = document.getElementById('doc_title').value;
            const type = document.getElementById('doc_type').value;
            const summary = document.getElementById('doc_content_summary').value;

            try {
                const response = await fetch('http://127.0.0.1:8000/save_doc', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, doc_type: type, content_summary: summary })
                });
                
                const result = await response.json();
                document.getElementById('statusMsg').innerText = result.message;

                // Clear form and refresh table
                document.getElementById('doc_title').value = '';
                document.getElementById('doc_content_summary').value = '';
                loadDocuments();
            } catch (error) {
                console.error("Error saving:", error);
            }
        }

        async function loadDocuments() {
            try {
                const response = await fetch('http://127.0.0.1:8000/get-all-docs');
                const data = await response.json();
                const tableBody = document.getElementById('docTableBody');
                tableBody.innerHTML = ''; 

                data.Documents.forEach(doc => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${doc.id}</td>
                        <td>${doc.title}</td>
                        <td>${doc.doc_type}</td>
                        <td>${doc.created_by}</td>
                        <td>${doc.content_summary}</td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error("Error loading:", error);
            }
        }

        window.onload = loadDocuments;
    </script>
</body>
</html>
