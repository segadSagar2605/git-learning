<!DOCTYPE html>
<html>
  <head>
    <title>OpenText New Document</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>OpenText New Document</h1>
    <!-- <form action="/save_doc" method="post"> -->

      <label>Document Title:</label><br>
      <input type="text" id="doc_title" name="doc_title" placeholder="e.g., Q2 Financials" required><br><br>

      <label>Document Type:</label><br>
      <select id="doc_type" name="doc_type">
        <option value="Spreadsheet">Spreadsheet</option>
        <option value="PDF">PDF</option>
        <option value="Word">Word Document</option>
      </select>
      <br><br>

      <label>Content Summary (AI-ready):</label><br>
      <textarea id="doc_content_summary" placeholder="Enter a brief summary..." style="width: 100%; height: 60px;"></textarea>
      <br><br>

      <!-- <button type="submit">Save Document</button> -->
      <button type="button" onclick="saveDocument()">Save Document</button>
      <p id="statusMsg" style="color: blue; font-weight: bold;"></p>

      <!-- Horizontal line to separate the form from the dashboard to show the saved documents -->
      <hr>
      <h2>Document Dashboard </h2>
      <button type="button" onclick="loadDocuments()">View All Documents </button>
      <ul id="docList" style="margin-top: 20px;">
      </ul>


         
<script>
console.log("JS LOADED SUCCESSFULLY");



async function saveDocument() {
    console.log("1. Function started");

    try {
        const title = document.getElementById('doc_title').value;
        const type = document.getElementById('doc_type').value;
        const summary = document.getElementById('doc_content_summary').value;

        console.log("2. Data collected:", { title, type, summary });

        const response = await fetch('http://127.0.0.1:8000/save_doc', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                title: title,
                doc_type: type,
                content_summary: summary
            })
        });

        console.log("3. Fetch sent, status:", response.status);

        const result = await response.json();
        console.log("4. Server response:", result);

        document.getElementById('statusMsg').innerText = result.message;
        //alert(result.message);

        document.getElementById('doc_title').value = '';
        document.getElementById('doc_type').value = 'Spreadsheet';
        document.getElementById('doc_content_summary').value = '';

        //loadDocuments();

    } catch (error) {
        console.error("CRITICAL ERROR:", error);
        alert("JS Error: " + error.message);
    }
}

async function loadDocuments() {
    console.log("Loading documents...");
    try {
        const response = await fetch('http://127.0.0.1:8000/get-all-docs');
        const data = await response.json();

        const listElement = document.getElementById('docList');
        listElement.innerHTML = '';

        data.Documents.forEach(doc => {
            const listItem = document.createElement('li');
            listItem.textContent = `Title: ${doc.title}, Type: ${doc.doc_type}, Created by: ${doc.created_by}, Summary: ${doc.content_summary}, Created at: ${new Date(doc.created_at).toLocaleString()} `;
            listElement.appendChild(listItem);
        });
    } catch (error) {
        console.error("Load Error:", error);
        alert("Load Error: " + error.message);
    }
}
</script>


  </body>
</html>
